name: V2 checks

on:
  push:
    branches: ["main"]
    paths:
      - "V2/**"
      - "1674_坤輿圖說_WS.txt"
      - "1799_地球圖説_WS.txt"
  pull_request:
    branches: ["main"]
    paths:
      - "V2/**"
      - "1674_坤輿圖說_WS.txt"
      - "1799_地球圖説_WS.txt"
  workflow_dispatch:

jobs:
  v2-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m py_compile scripts/dh_v2.py scripts/build_case.py
      - run: make all
