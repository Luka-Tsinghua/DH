name: V2 checks

on:
  push:
    branches: ["main", "codex/**"]
    paths:
      - "V2/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".gitignore"
      - ".github/**"
      - "1674_坤輿圖說_WS.txt"
      - "1799_地球圖説_WS.txt"
  pull_request:
    branches: ["main"]
    paths:
      - "V2/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".gitignore"
      - ".github/**"
      - "1674_坤輿圖說_WS.txt"
      - "1799_地球圖説_WS.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable CLI and test dependencies
        run: python -m pip install -e "./V2[dev]"
      - name: Check syntax and documentation links
        run: |
          python -m py_compile V2/scripts/dh_v2.py V2/scripts/build_case.py V2/scripts/check_docs.py
          python V2/scripts/check_docs.py
      - name: Check installed entry points
        run: |
          dh-v2 --help
          dh-v2-build-case --help
      - name: Run complete pipeline
        run: dh-v2 pipeline
      - name: Run tests
        run: python -m pytest V2/tests -q
      - name: Check source files remain unchanged
        run: git diff --exit-code
